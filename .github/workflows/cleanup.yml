name: Cleanup Runs
on: workflow_dispatch
permissions:
  actions: write
jobs:
  delete-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs --paginate --jq '.workflow_runs[].id' | xargs -I {} gh api repos/${{ github.repository }}/actions/runs/{} -X DELETE
